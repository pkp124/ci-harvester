# CI Harvester - Docker Compose Development Stack
# Usage: docker-compose -f docker/docker-compose.yml up -d

version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: 'zTvhk1e3HqA5ykKjA8R0ggUPhSGjq7OgxC5nV4ypqO0='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'ci-harvester-secret-key'
    # CI Harvester settings
    DATABASE_URL: postgresql://ci_harvester:ci_harvester@postgres-data:5432/ci_harvester
    JENKINS_URL: ${JENKINS_URL:-https://jenkins.example.com}
    JENKINS_USERNAME: ${JENKINS_USERNAME:-}
    JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../ci_harvester:/opt/airflow/ci_harvester
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-data:
      condition: service_healthy

services:
  # ==========================================================================
  # PostgreSQL for Airflow metadata
  # ==========================================================================
  postgres-airflow:
    image: postgres:15-alpine
    container_name: ci-harvester-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  # ==========================================================================
  # PostgreSQL for CI Harvester data
  # ==========================================================================
  postgres-data:
    image: postgres:15-alpine
    container_name: ci-harvester-postgres-data
    environment:
      POSTGRES_USER: ci_harvester
      POSTGRES_PASSWORD: ci_harvester
      POSTGRES_DB: ci_harvester
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docs/design/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_harvester"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ==========================================================================
  # Redis (for Celery if needed)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ci-harvester-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ==========================================================================
  # Airflow Init (one-time setup)
  # ==========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: ci-harvester-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Airflow initialized"
    restart: "no"

  # ==========================================================================
  # Airflow Webserver
  # ==========================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: ci-harvester-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================================================
  # Airflow Scheduler
  # ==========================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: ci-harvester-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================================================
  # CI Harvester API
  # ==========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ci-harvester-api
    environment:
      DATABASE_URL: postgresql://ci_harvester:ci_harvester@postgres-data:5432/ci_harvester
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ../ci_harvester:/app/ci_harvester
    depends_on:
      postgres-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # ==========================================================================
  # Adminer (Database GUI)
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: ci-harvester-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres-data
    restart: always

volumes:
  postgres-airflow-data:
  postgres-data:
  airflow-logs:

networks:
  default:
    name: ci-harvester-network
